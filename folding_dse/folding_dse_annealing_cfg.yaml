#Die:  1.10 x 0.91 mm^2(W2W F2F HB, pitch 5um)
# 以下模块尺寸、面积、功耗及未指定的互联数均为脱敏估计值。
# 本版每个模块面积约为最初估计的1.7倍；3倍总面积超过两层面积上限，无法排布。

#硬模块，固定矩形[x_mm,y_mm,w_mm,h_mm]：
l2_b0: [0.035, 0.055, 0.338999, 0.456344]
l2_b1: [0.726001, 0.055, 0.338999, 0.456344]

#软模块，（锚点，面积---宽高比自适应）x,y为“锚点参考点”，布局器优先放其附近
#[x_mm, y_mm, area_mm2]
if_pp: [0.18, 0.61, 0.0680]
if_ctl: [0.38, 0.64, 0.0408]
l2_ctl: [0.54, 0.38, 0.0629]
tpe: [0.27, 0.67, 0.0459]
ls: [0.73, 0.43, 0.0782]
mmu: [0.84, 0.64, 0.0595]
id: [0.32, 0.29, 0.0595]
rn: [0.48, 0.27, 0.0527]
is_int: [0.62, 0.28, 0.0748]
ix: [0.66, 0.49, 0.0884]
vec_vx: [0.92, 0.72, 0.1088]
is_int_fwd: [0.71, 0.72, 0.0510]
is_int_rf: [0.45, 0.72, 0.0680]
vec_is_vec: [0.94, 0.40, 0.0680]

#==单die约束==
die_width_mm: 1.10
die_height_mm: 0.91
die_area_limit_mm2: 0.702
area_margin: 0.95
bond_pitch_um: 5.0
bond_window_mm: 0.10
bond_reserve_fraction: 0.20
module_gap_mm: 0.008

#==分层分配==
fixed_bottom:
- l2_b0
- l2_b1

fixed_top: []

movable_modules:
- if_pp
- if_ctl
- l2_ctl
- tpe
- ls
- mmu
- id
- rn
- is_int
- ix
- vec_vx
- is_int_fwd
- is_int_rf
- vec_is_vec

#初始分区：
movable_initial_layer:
- if_pp: bottom
- if_ctl: bottom
- l2_ctl: bottom
- tpe: top
- ls: top
- mmu: top
- id: top
- rn: top
- is_int: top
- ix: top
- vec_vx: top
- is_int_fwd: top
- is_int_rf: top
- vec_is_vec: top

#==模块动态功耗(W) ==
power_w:
  l2_b0: 0.45
  l2_b1: 0.45
  if_pp: 0.26
  if_ctl: 0.15
  l2_ctl: 0.23
  tpe: 0.15
  ls: 0.55
  mmu: 0.24
  id: 0.25
  rn: 0.24
  is_int: 0.40
  ix: 0.55
  vec_vx: 0.82
  is_int_fwd: 0.24
  is_int_rf: 0.43
  vec_is_vec: 0.40

#==模块间互联信号数===
interconnect:
- [l2_b0, l2_ctl, 5000]
- [l2_b1, l2_ctl, 900]
- [if_pp, if_ctl, 120]
- [if_ctl, id, 200]
- [id, rn, 300]
- [rn, is_int, 320]
- [is_int, ix, 440]
- [ix, is_int_fwd, 450]
- [is_int_fwd, is_int_rf, 350]
- [is_int_rf, is_int, 320]
- [rn, vec_is_vec, 250]
- [vec_is_vec, vec_vx, 550]
- [ix, ls, 280]
- [ls, mmu, 230]
- [ls, l2_ctl, 500]
- [mmu, l2_ctl, 180]
- [tpe, if_ctl, 150]
- [vec_vx, ls, 380]

max_density_per_mm2: 20000
